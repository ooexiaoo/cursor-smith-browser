<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ef0ff"/>
      <stop offset="0.55" stop-color="#4cc2f7"/>
      <stop offset="1" stop-color="#7b6cf6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- motion smear, the thing the plugin is actually about -->
  <g opacity="0.32" filter="url(#glow)">
    <rect x="46" y="22" width="17" height="46" rx="4" fill="#4cc2f7"/>
    <rect x="33" y="24" width="12" height="42" rx="4" fill="#4cc2f7" opacity="0.6"/>
  </g>
  <!-- the caret -->
  <g filter="url(#glow)">
    <rect x="56" y="20" width="21" height="56" rx="5" fill="url(#g)"/>
  </g>
  <!-- serifs, matching the default Box style -->
  <g fill="url(#g)">
    <rect x="48" y="20" width="9" height="9" rx="3"/>
    <rect x="76" y="20" width="9" height="9" rx="3"/>
    <rect x="48" y="67" width="9" height="9" rx="3"/>
    <rect x="76" y="67" width="9" height="9" rx="3"/>
  </g>
</svg>
